---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: views.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: View
    listKind: ViewList
    plural: views
    singular: view
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: View is the Schema for the views API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ViewSpec defines the desired state of a View.
            properties:
              filters:
                description: Selected filters.
                properties:
                  filters:
                    description: List of filters.
                    items:
                      description: ViewsV1Filter is the views.v1.Filter object of
                        the API.
                      properties:
                        name:
                          description: Filter name
                          type: string
                        selectedValues:
                          additionalProperties:
                            type: boolean
                          description: Filter values to select, each set to true.
                            The service keeps only the values set to true and drops
                            a value set to false.
                          type: object
                      required:
                      - name
                      - selectedValues
                      type: object
                    minItems: 1
                    type: array
                required:
                - filters
                type: object
              folder:
                description: |-
                  Unique identifier for folders
                  It refers to a ViewFolder custom resource through resourceRef.
                properties:
                  resourceRef:
                    description: Reference to a Coralogix resource within the cluster.
                    properties:
                      name:
                        description: Name of the resource (not id).
                        type: string
                      namespace:
                        description: Kubernetes namespace.
                        type: string
                    required:
                    - name
                    type: object
                required:
                - resourceRef
                type: object
              name:
                description: View name
                type: string
              searchQuery:
                description: Search query.
                properties:
                  query:
                    description: Query string.
                    type: string
                  syntaxType:
                    default: lucene
                    description: Syntax type.
                    enum:
                    - lucene
                    - dataprime
                    type: string
                required:
                - query
                type: object
              timeSelection:
                description: Time selection.
                properties:
                  customSelection:
                    description: Custom time selection.
                    properties:
                      fromTime:
                        description: The from time.
                        format: date-time
                        type: string
                      toTime:
                        description: The to time.
                        format: date-time
                        type: string
                    required:
                    - fromTime
                    - toTime
                    type: object
                  quickSelection:
                    description: Quick time selection.
                    properties:
                      seconds:
                        description: Length of the quick time range, in seconds. The
                          service stores the nearest of 60, 120, 300, 900, 1800, 3600,
                          7200, 21600, 43200, 86400, 172800, 259200, 432000, and 604800.
                        format: int32
                        type: integer
                    required:
                    - seconds
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of customSelection, quickSelection must be
                    set
                  rule: '(has(self.customSelection) ? 1 : 0) + (has(self.quickSelection)
                    ? 1 : 0) == 1'
              viewType:
                default: logs
                description: View type.
                enum:
                - logs
                - templates
                - archiveLogs
                - archiveTemplates
                type: string
            required:
            - filters
            - name
            - timeSelection
            type: object
          status:
            description: ViewStatus defines the observed state of a View.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

