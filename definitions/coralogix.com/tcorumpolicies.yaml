---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: tcorumpolicies.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: TCORumPolicies
    listKind: TCORumPoliciesList
    plural: tcorumpolicies
    singular: tcorumpolicies
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TCORumPolicies is the Schema for the TCORumPolicies API.
          NOTE: This resource performs an atomic overwrite of all existing TCO RUM policies
          in the backend. Any existing policies not defined in this resource will be
          removed. Use with caution as this operation is destructive.

          See also https://coralogix.com/docs/tco-optimizer-api

          **Added in v0.5.0**
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TCORumPoliciesSpec defines the desired state of Coralogix
              TCO RUM policies.
            properties:
              policies:
                description: Coralogix TCO-Policies-List.
                items:
                  description: A TCO policy for RUM (browser/mobile) events.
                  properties:
                    applications:
                      description: The applications to apply the policy on. Applies
                        the policy on all the applications by default.
                      properties:
                        names:
                          description: Names to match.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        ruleType:
                          description: Type of matching for the name.
                          enum:
                          - is
                          - is_not
                          - start_with
                          - includes
                          type: string
                      required:
                      - names
                      - ruleType
                      type: object
                    archiveRetention:
                      description: Matches the specified retention.
                      properties:
                        backendRef:
                          description: Reference to the retention policy
                          properties:
                            name:
                              description: Name of the policy.
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - backendRef
                      type: object
                    description:
                      description: Description of the policy.
                      type: string
                    disabled:
                      description: Whether the policy is disabled.
                      type: boolean
                    dpxlExpression:
                      description: |-
                        A DPXL expression to match RUM events on. Mutually exclusive with severities; exactly one of the two is required.
                        The expression must carry a <v1> version prefix and use the canonical $d.* schema (NOT $d.cx_rum.*),
                        otherwise it fails to compile.
                      minLength: 1
                      type: string
                    name:
                      description: Name of the policy.
                      maxLength: 255
                      minLength: 1
                      type: string
                    priority:
                      description: The policy priority.
                      enum:
                      - block
                      - high
                      - medium
                      - low
                      type: string
                    priorityOverride:
                      description: Dynamic quota-based priority override for the policy.
                      properties:
                        quotaBased:
                          description: TCOPolicyQuotaBased maps daily quota consumption
                            percentages to priority levels.
                          properties:
                            usageTiers:
                              items:
                                description: TCOPolicyUsageTier maps a daily quota
                                  threshold percentage to a priority.
                                properties:
                                  dailyQuotaPercentage:
                                    anyOf:
                                    - type: integer
                                    - type: string
                                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                    x-kubernetes-int-or-string: true
                                  priority:
                                    enum:
                                    - block
                                    - high
                                    - low
                                    - medium
                                    type: string
                                required:
                                - dailyQuotaPercentage
                                - priority
                                type: object
                              minItems: 1
                              type: array
                          required:
                          - usageTiers
                          type: object
                      type: object
                    severities:
                      description: The severities to apply the policy on. Mutually
                        exclusive with dpxlExpression; exactly one of the two is required.
                      items:
                        description: The severities to apply the policy on.
                        enum:
                        - info
                        - warning
                        - critical
                        - error
                        - debug
                        - verbose
                        type: string
                      maxItems: 6
                      minItems: 1
                      type: array
                    subsystems:
                      description: The subsystems to apply the policy on. Applies
                        the policy on all the subsystems by default.
                      properties:
                        names:
                          description: Names to match.
                          items:
                            type: string
                          maxItems: 50
                          minItems: 1
                          type: array
                        ruleType:
                          description: Type of matching for the name.
                          enum:
                          - is
                          - is_not
                          - start_with
                          - includes
                          type: string
                      required:
                      - names
                      - ruleType
                      type: object
                  required:
                  - name
                  - priority
                  type: object
                  x-kubernetes-validations:
                  - message: severities and dpxlExpression are mutually exclusive
                    rule: '!(has(self.severities) && has(self.dpxlExpression))'
                maxItems: 10000
                type: array
            required:
            - policies
            type: object
          status:
            description: TCORumPoliciesStatus defines the observed state of TCORumPolicies.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

