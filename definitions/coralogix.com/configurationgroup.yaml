---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: configurationgroups.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: ConfigurationGroup
    listKind: ConfigurationGroupList
    plural: configurationgroups
    singular: configurationgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ConfigurationGroup is the Schema for the configurationgroups API.
          This resource is in Preview and may change in breaking ways. It uses the Fleet Manager configuration-groups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ConfigurationGroupSpec defines the desired state of a Fleet Manager configuration group.
              It mirrors the configuration-groups API create request. This resource is in Preview.
            properties:
              description:
                description: Human-readable description.
                maxLength: 4096
                type: string
              family:
                description: Latest configuration family for this group.
                properties:
                  active:
                    description: Whether this family is active. Defaults to false.
                    type: boolean
                  description:
                    description: Human-readable description.
                    maxLength: 4096
                    type: string
                  preset:
                    description: Configuration template settings; Coralogix generates
                      the remote configurations from them.
                    properties:
                      chartName:
                        description: |-
                          Configuration template type: CHART_NAME_OTEL_INTEGRATION for Kubernetes, CHART_NAME_OTEL_ECS_EC2 for ECS on EC2,
                          or CHART_NAME_OTEL_LINUX_STANDALONE, CHART_NAME_OTEL_WINDOWS_STANDALONE, or CHART_NAME_OTEL_MACOS_STANDALONE for hosts.
                        enum:
                        - CHART_NAME_OTEL_INTEGRATION
                        - CHART_NAME_OTEL_LINUX_STANDALONE
                        - CHART_NAME_OTEL_WINDOWS_STANDALONE
                        - CHART_NAME_OTEL_MACOS_STANDALONE
                        - CHART_NAME_OTEL_ECS_EC2
                        type: string
                      chartVersion:
                        description: |-
                          Configuration template version. It determines the OTel Collector version, the generated collector configuration,
                          and which integrationVersion values are supported. Unsupported versions are rejected.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      integrationVersion:
                        description: Version of the observability features format.
                          Omit it to use the default for the template type and version.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        description: |-
                          Environment setup values for the configuration template, such as ClusterName, KubernetesRunningOn,
                          ApplicationName, or SubsystemName. Set the observability features in observabilityFeatures.
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      observabilityFeatures:
                        description: |-
                          Observability feature settings for the configuration template, as a JSON object string;
