---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: configurationgroups.coralogix.com
spec:
  group: coralogix.com
  names:
    kind: ConfigurationGroup
    listKind: ConfigurationGroupList
    plural: configurationgroups
    singular: configurationgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.printableStatus
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ConfigurationGroup is the Schema for the configurationgroups
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConfigurationGroupSpec defines the desired state of a ConfigurationGroup.
            properties:
              description:
                description: Description of the group's purpose.
                maxLength: 4096
                type: string
              family:
                description: Latest configuration family of the group.
                properties:
                  active:
                    description: Whether this family is eligible for delivery to matching
                      agents. This is not confirmation that an agent has applied it.
                    type: boolean
                  description:
                    description: Human-readable description.
                    maxLength: 4096
                    type: string
                  preset:
                    description: Configuration template settings; present when the
                      family has a chartName and observability features.
                    properties:
                      chartName:
                        description: 'Configuration template type: CHART_NAME_OTEL_INTEGRATION
                          for Kubernetes, CHART_NAME_OTEL_ECS_EC2 for ECS on EC2,
                          or CHART_NAME_OTEL_LINUX_STANDALONE, CHART_NAME_OTEL_WINDOWS_STANDALONE,
                          or CHART_NAME_OTEL_MACOS_STANDALONE for hosts.'
                        enum:
                        - CHART_NAME_OTEL_INTEGRATION
                        - CHART_NAME_OTEL_LINUX_STANDALONE
                        - CHART_NAME_OTEL_WINDOWS_STANDALONE
                        - CHART_NAME_OTEL_MACOS_STANDALONE
                        - CHART_NAME_OTEL_ECS_EC2
                        type: string
                      chartVersion:
                        description: Configuration template version. It determines
                          the OTel Collector version, the generated collector configuration,
                          and which integrationVersion values are supported. Unsupported
                          versions are rejected.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      integrationVersion:
                        description: Version of the observability features format
                          used for this configuration family.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        description: 'Environment setup values for the configuration
                          template, such as ClusterName, KubernetesRunningOn, ApplicationName,
                          or SubsystemName. Example: `{"ClusterName":"production-eu2"}`.'
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      observabilityFeatures:
                        description: 'Observability feature settings for the configuration
                          template, as a JSON object string; the available features
                          depend on chartName and integrationVersion. Example: `{"logs":{"enabled":true}}`.'
                        maxLength: 1048576
                        minLength: 2
                        type: string
                    required:
                    - chartName
                    - chartVersion
                    - observabilityFeatures
                    type: object
                  raw:
                    description: Inputs of a configuration family defined directly
                      by its remote configurations; present when the family has no
                      chartName.
                    properties:
                      collectorVersion:
                        description: Collector semantic version targeted by this family.
                          This is separate from the family version and the Supervisor
                          image tag.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        description: 'Metadata stored with this configuration family.
                          Example: `{"team":"platform"}`.'
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      remoteConfigurations:
                        description: Remote configurations of this configuration family.
                        items:
                          description: ConfigurationGroupRemoteConfiguration is the
                            RemoteConfiguration object of the API.
                          properties:
                            agentSelector:
                              description: Flat agent attributes that match agents
                                for this configuration.
                              properties:
                                attributes:
                                  additionalProperties:
                                    type: string
                                  description: 'Attributes of the stored selector.
                                    A remote configuration saved with an omitted or
                                    empty selector is returned without agentSelector,
                                    so the empty match-all selection is preserved;
                                    attributes are not expanded to the currently matched
                                    agents. Example: `{"cx.agent.type":"docker","host.name":"collector-host-01","service.version":"0.160.0"}`.'
                                  type: object
                              type: object
                            name:
                              description: Remote configuration name.
                              maxLength: 256
                              type: string
                            rawConfiguration:
                              description: Collector YAML sent to matching agents.
                              maxLength: 1048576
                              minLength: 1
                              type: string
                          required:
                          - rawConfiguration
                          type: object
                        maxItems: 128
                        minItems: 1
                        type: array
                    required:
                    - remoteConfigurations
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of preset or raw is required
                  rule: has(self.preset) != has(self.raw)
              name:
                description: Display name shown in Fleet Management, unique among
                  the team's configuration groups.
                maxLength: 256
                minLength: 1
                type: string
              priorityOrder:
                description: Selection priority when multiple configurations match
                  an agent. Higher values take precedence.
                format: int32
                maximum: 2147483647
                minimum: -2147483648
                type: integer
              tags:
                description: Tags for organizing the group. Tags do not select agents.
                items:
                  maxLength: 256
                  type: string
                maxItems: 64
                type: array
            required:
            - family
            - name
            type: object
          status:
            description: ConfigurationGroupStatus defines the observed state of a
              ConfigurationGroup.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

