                        maxLength: 1048576
                        minLength: 2
                        type: string
                    required:
                    - chartName
                    - chartVersion
                    - observabilityFeatures
                    type: object
                  raw:
                    description: |-
                      Configuration family defined directly by its remote configurations, each with an
                      OTel Collector configuration and an agent selector.
                    properties:
                      collectorVersion:
                        description: |-
                          Collector semantic version this family targets, without a leading v prefix.
                          Every agentSelector must then set service.version to this value.
                        maxLength: 256
                        pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-((?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$
                        type: string
                      metadata:
                        additionalProperties:
                          type: string
                        description: Metadata stored with this configuration family.
                        maxProperties: 64
                        type: object
                        x-kubernetes-validations:
                        - message: metadata values must be at most 4096 characters
                          rule: self.all(k, size(self[k]) <= 4096)
                      remoteConfigurations:
                        description: Remote configurations in this family.
                        items:
                          description: RemoteConfigurationSpec is a remote OpenTelemetry
                            Collector configuration.
                          properties:
                            agentSelector:
                              description: Agent attributes that match agents for
                                this configuration.
                              properties:
                                attributes:
                                  additionalProperties:
                                    type: string
                                  description: Flat agent attributes to match. If
                                    collectorVersion is set, service.version must
                                    match it.
                                  type: object
                              type: object
                            name:
                              description: Remote configuration name.
                              maxLength: 256
                              type: string
                            rawConfiguration:
                              description: OpenTelemetry Collector configuration YAML.
                                The supervisor-managed OpAMP extension must not be
                                configured.
                              maxLength: 1048576
                              minLength: 1
                              type: string
                          required:
                          - rawConfiguration
                          type: object
                        maxItems: 128
                        minItems: 1
                        type: array
                    required:
                    - remoteConfigurations
                    type: object
                type: object
                x-kubernetes-validations:
                - message: Exactly one of preset or raw is required
                  rule: has(self.preset) != has(self.raw)
              name:
                description: Display name. Group names are unique per team and cannot
                  be cleared.
                maxLength: 256
                minLength: 1
                type: string
              priorityOrder:
                description: Selection precedence. Higher values win on ties and 0
                  is the default.
                format: int32
                type: integer
              tags:
                description: Tags attached to the configuration group.
                items:
                  maxLength: 256
                  type: string
                maxItems: 64
                type: array
            required:
            - family
            - name
            type: object
          status:
            description: ConfigurationGroupStatus defines the observed state of ConfigurationGroup.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              id:
                type: string
              printableStatus:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

