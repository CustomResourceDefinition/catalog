                                  minLength: 1
                                  pattern: ^-?[0-9]+$
                                  type: string
                                upper:
                                  description: Highest matching value, included.
                                  maxLength: 20
                                  minLength: 1
                                  pattern: ^-?[0-9]+$
                                  type: string
                              required:
                              - lower
                              - upper
                              type: object
