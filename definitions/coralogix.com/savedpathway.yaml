                maxLength: 1024
                minLength: 1
                type: string
              pagesCount:
                default: 5
                description: Number of pages after or before view in each path.
                format: int32
                maximum: 2147483647
                minimum: 1
                type: integer
              timeRange:
                description: Time range of the pathway.
                properties:
                  calendar:
                    description: Named calendar window, resolved in the viewer's timezone.
                      CALENDAR_WINDOW_UNSPECIFIED is rejected.
                    enum:
                    - today
                    - yesterday
                    type: string
                  fixed:
                    description: Absolute time range between two timestamps.
                    properties:
                      fromTimestampMs:
                        description: 'Start of the range, in Unix milliseconds. Inclusive:
                          events at exactly this time are in the range.'
                        maxLength: 20
                        minLength: 1
                        pattern: ^[1-9][0-9]{0,18}$
                        type: string
                      toTimestampMs:
                        description: 'End of the range, in Unix milliseconds. Exclusive:
                          events at exactly this time are not in the range, so consecutive
                          ranges can share a boundary.'
                        maxLength: 20
                        minLength: 1
                        pattern: ^[1-9][0-9]{0,18}$
                        type: string
                    required:
                    - fromTimestampMs
                    - toTimestampMs
                    type: object
                  relativeMinutes:
                    description: Number of minutes back from now.
                    maxLength: 20
                    minLength: 1
                    pattern: ^[1-9][0-9]{0,18}$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: Exactly one of calendar, fixed, relativeMinutes must be
                    set
                  rule: '(has(self.calendar) ? 1 : 0) + (has(self.fixed) ? 1 : 0)
                    + (has(self.relativeMinutes) ? 1 : 0) == 1'
              topN:
                default: 20
                description: Number of paths shown, most common first.
                format: int32
                maximum: 2147483647
                minimum: 1
                type: integer
              view:
                description: View (page) the paths are traced from.
                maxLength: 1024
                minLength: 1
