                          enum:
                          - errorCount
                          - actionCount
                          - longTaskCount
                          - crashCount
                          - resourceCount
                          - scrollDepthPercentage
                          - viewportWidth
                          - viewportHeight
                          - rageClickCount
                          - deadClickCount
