                              - notEqual
                              - contains
                              - notContains
                              - startWith
                              - notStartWith
                              - endWith
                              - notEndWith
                              type: string
                            values:
                              description: Values to match. At least one is required.
                              items:
                                maxLength: 1024
                                minLength: 1
                                type: string
                              maxItems: 100
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                          required:
                          - operator
                          - values
                          type: object
                        field:
                          description: String field to filter on. STRING_FILTER_FIELD_UNSPECIFIED
                            is rejected.
                          enum:
                          - urlSchema
                          - urlSubdomain
                          - urlDomain
                          - urlHost
                          - urlPath
                          - urlTemplate
                          - referrerSchema
                          - referrerSubdomain
                          - referrerDomain
                          - referrerHost
                          - referrerPath
                          - referrerUrl
                          - sessionId
                          - userId
                          - userEmail
                          - userName
                          - cxUserId
                          - accountId
                          - accountName
                          - viewId
                          - platform
                          - environment
                          - appVersion
                          - cxSdkVersion
                          - browserName
                          - browserVersion
                          - browserMajorVersion
                          - os
                          - osMajorVersion
                          - osVersion
                          - deviceType
                          - deviceName
                          - deviceBrand
                          - deviceModel
                          - deviceArchitecture
                          - countryName
                          - cityName
                          - continentName
                          - ip
                          - userAgent
                          - appName
                          - clicksElementFingerprint
