              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SavedPathwaySpec defines the desired state of a SavedPathway.
            properties:
              appName:
                description: RUM application the pathway belongs to.
                maxLength: 1024
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.appName is immutable
                  rule: self == oldSelf
              direction:
                default: after
                description: Whether the paths show the pages after or before view.
                enum:
                - after
                - before
                type: string
              filters:
                description: Session filters of the pathway. Empty when not set.
                items:
                  description: SavedPathwayViewFilter is the ViewFilter object of
                    the API.
                  properties:
                    boolFilter:
                      description: A boolean field with the value it must have.
                      properties:
                        field:
                          description: Boolean field to filter on. BOOL_FILTER_FIELD_UNSPECIFIED
                            is rejected.
                          enum:
                          - hasSessionReplay
                          - hasScreenshot
                          - isRageClick
                          - isDeadClick
                          type: string
                        value:
                          description: Value the field must have.
                          type: boolean
                      required:
                      - field
                      - value
                      type: object
                    numericFilter:
                      description: A numeric field with the condition it must match.
                      properties:
                        condition:
                          description: Condition the field must match.
                          properties:
                            max:
