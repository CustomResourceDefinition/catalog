apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: (devel)
  name: serviceprincipals.entra.azure.com
spec:
  group: entra.azure.com
  names:
    categories:
    - azure
    - entra
    kind: ServicePrincipal
    listKind: ServicePrincipalList
    plural: serviceprincipals
    singular: serviceprincipal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].severity
      name: Severity
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].message
      name: Message
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              appId:
                pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                type: string
              displayName:
                minLength: 1
                type: string
              operatorSpec:
                properties:
                  configmaps:
                    properties:
                      appId:
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            type: object
                          key:
                            type: string
                          labels:
                            additionalProperties:
                              type: string
                            type: object
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      entraID:
                        properties:
                          annotations:
                            additionalProperties:
                              type: string
                            type: object
                          key:
                            type: string
                          labels:
                            additionalProperties:
                              type: string
                            type: object
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  creationMode:
                    enum:
                    - AdoptOrCreate
                    - AlwaysCreate
                    - AdoptOnly
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: appId or displayName must be specified
              rule: has(self.appId) || has(self.displayName)
            - message: appId must be specified when creationMode is AlwaysCreate
              rule: '!has(self.operatorSpec) || !has(self.operatorSpec.creationMode)
                || self.operatorSpec.creationMode != ''AlwaysCreate'' || has(self.appId)'
          status:
            properties:
              appId:
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    reason:
                      type: string
                    severity:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
              displayName:
                type: string
              entraID:
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
